[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./deployments" }
]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
hyperevm_testnet = "${HYPEREVM_TESTNET_RPC_URL}"
