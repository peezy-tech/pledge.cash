name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test web
        run: bun --cwd apps/web test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check docs
        run: bun run docs:check

      - name: Build public docs
        env:
          PLEDGE_CASH_APP_HREF: /
          PLEDGE_CASH_DOCS_BASE_PATH: /docs
          PLEDGE_CASH_DOCS_OUT_DIR: ${{ runner.temp }}/pledge-docs-public
        run: bun run docs:build

      - name: Build HQ docs
        env:
          PLEDGE_CASH_APP_HREF: /pledge-cash/
          PLEDGE_CASH_DOCS_BASE_PATH: /pledge-cash/docs
          PLEDGE_CASH_DOCS_OUT_DIR: ${{ runner.temp }}/pledge-docs-hq
        run: bun run docs:build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Foundry version
        run: forge --version

      - name: Verify Foundry CI safety
        working-directory: packages/contracts
        run: |
          forge config --json | jq -e '
            .ffi == false and
            (.fs_permissions | length == 1) and
            .fs_permissions[0].access == true and
            .fs_permissions[0].path == "./deployments"
          '

      - name: Build
        working-directory: packages/contracts
        run: forge build --sizes

      - name: Verify generated SDK is current
        run: |
          bun --cwd packages/sdk generate
          git diff --exit-code -- packages/sdk/src/generated.ts

      - name: Verify testnet artifacts
        run: bun --cwd packages/contracts verify:testnet-artifacts

      - name: Test
        working-directory: packages/contracts
        run: forge test -vvv

      - name: Format
        working-directory: packages/contracts
        run: forge fmt --check

  sentinel:
    name: Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Foundry version
        run: forge --version

      - name: Test SDK
        run: bun --cwd packages/sdk test

      - name: Test Sentinel
        run: bun --cwd services/sentinel test

      - name: Run Sentinel Anvil integration
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun --cwd services/sentinel integration:anvil

  x402-router:
    name: x402 Router
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: x402_router
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d x402_router"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify toolchain
        run: |
          bun --version
          forge --version
          anvil --version

      - name: Verify x402 router migration snapshot
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/x402_router
        run: |
          bun --cwd services/x402-router drizzle:generate
          test -z "$(git status --porcelain -- services/x402-router/drizzle)"

      - name: Test x402 router
        env:
          X402_ROUTER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/x402_router
        run: bun run router:test

      - name: Run deterministic router integration
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/x402_router
        run: bun run router:integration:anvil
