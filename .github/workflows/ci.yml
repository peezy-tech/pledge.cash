name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        working-directory: packages/contracts
        run: forge build

      - name: Test
        working-directory: packages/contracts
        run: forge test -vvv

      - name: Format
        working-directory: packages/contracts
        run: forge fmt --check
