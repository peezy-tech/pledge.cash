name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install

      - name: Check docs
        run: bun run docs:check

      - name: Verify configured Sentinel API
        if: ${{ vars.VITE_SENTINEL_API_URL != '' }}
        env:
          SENTINEL_API_URL: ${{ vars.VITE_SENTINEL_API_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors "${SENTINEL_API_URL%/}/health"

      - name: Build site
        env:
          VITE_SENTINEL_API_URL: ${{ vars.VITE_SENTINEL_API_URL }}
        run: bun --cwd apps/web build:pages

      - name: Verify Alerts return route
        run: cmp apps/web/dist/index.html apps/web/dist/notifications/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
